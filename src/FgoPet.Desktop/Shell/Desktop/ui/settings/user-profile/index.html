<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>用户资料</title>
  <link rel="stylesheet" href="profile.css">
  <script src="profile.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">SETTINGS</p>
    <h1>用户资料</h1>
    <p id="status" role="status" aria-live="polite">正在读取资料…</p>
    <form id="profile-form">
      <label for="display-name">显示名称</label>
      <input id="display-name" maxlength="80" autocomplete="off" disabled>
      <p id="explanation"></p>
      <div class="actions">
        <button id="cancel" type="button" disabled>取消修改</button>
        <button id="reset" type="button" disabled>恢复默认</button>
        <button id="save" type="submit" disabled>保存</button>
      </div>
    </form>
  </main>
</body>
</html>
