<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Settings</title>
  <link rel="stylesheet" href="root.css">
  <link rel="stylesheet" href="margin.css">
  <script defer src="margin-select.js"></script>
  <script defer src="root-i18n.js"></script>
  <script type="module" src="root.js"></script>
</head>
<body>
  <div class="settings-layout">
    <aside class="settings-sidebar" aria-label="Settings navigation" data-i18n-aria-label="settings.navigation">
      <div class="sidebar-heading" data-i18n="settings.title">Settings</div>
      <nav id="settings-navigation" class="settings-navigation" aria-label="Settings groups" data-i18n-aria-label="settings.groups">
        <p class="navigation-loading" role="status">Loading settings…</p>
      </nav>
    </aside>

    <main class="settings-main">
      <header class="page-heading">
        <button id="settings-back" class="crumb" type="button" hidden><span class="back-chevron" aria-hidden="true">‹</span><span data-i18n="settings.back">Back</span><span id="settings-parent" class="crumb-parent"></span></button>
        <h1 id="page-title" tabindex="-1">Settings</h1>
        <p id="page-description" class="page-description"></p>
      </header>
      <p id="root-status" class="root-status" role="status" aria-live="polite"></p>
      <section id="page-content" class="page-content" aria-label="Settings page" data-i18n-aria-label="settings.page"></section>
    </main>
  </div>
</body>
</html>
