[project]
name = "fgo-pet-content"
version = "0.1.0"
description = "Local-first content extraction tools for FGO Pet"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "respx>=0.21,<1",
]

[project.scripts]
fgo-content = "fgo_pet_content.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fgo_pet_content"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
