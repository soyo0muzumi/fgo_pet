name: Tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  solution-tests:
    name: Release solution tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build the complete solution
        shell: pwsh
        run: |
          dotnet build FgoPet.sln -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all solution test projects
        shell: pwsh
        run: |
          dotnet test FgoPet.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
