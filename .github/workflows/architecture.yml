name: Architecture
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Evaluate project graph and validate architecture checks
        shell: pwsh
        run: ./scripts/test-architecture.ps1
