<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'">
  <title>Chat · FGO Pet</title>
  <link rel="stylesheet" href="margin.css">
  <link rel="stylesheet" href="chat.css">
  <script defer src="margin-i18n.js"></script>
  <script defer src="chat.js"></script>
  <script defer src="margin-select.js"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="icon-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M8 3v5H3M21 8h-5V3M3 16h5v5M16 21v-5h5"/></symbol>
    <symbol id="icon-hide" viewBox="0 0 16 16"><path d="M3.5 8h9"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="icon-send" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="icon-read" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-bottom" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="icon-source" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="icon-project" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  </svg>
  <main id="chat-window" class="sheet" data-i18n-aria-label="chat.chat.window">
    <header class="sheet-top">
      <button id="history-toggle" class="today-line" type="button" aria-expanded="false" aria-controls="history-panel" data-i18n-aria-label="chat.conversations">
        <span class="tl-k" data-i18n="chat.chat">Chat</span>
        <span class="tl-peek" id="role-name"></span>
        <svg class="tl-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <nav class="sheet-ctl" data-i18n-aria-label="chat.chat.actions">
        <button id="expand-window" type="button" class="" data-i18n-aria-label="chat.expand.window" data-i18n-title="chat.expand.window"><svg class="icon" aria-hidden="true"><use href="#icon-expand"></use></svg></button>
        <button id="hide-window" type="button" class="" data-i18n-aria-label="chat.hide.chat" data-i18n-title="chat.hide.chat"><svg class="icon" aria-hidden="true"><use href="#icon-hide"></use></svg></button>
        <details id="more-menu" class="sheet-menu">
          <summary data-i18n-aria-label="chat.more.actions" data-i18n-title="chat.more.actions"><svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg></summary>
          <div class="sheet-menu-paper">
            <button id="new-conversation" type="button" class="menu-action" data-i18n="chat.new.conversation"></button>
            <label class="model-choice"><span data-i18n="chat.model"></span><select id="model-select" data-i18n-aria-label="chat.choose.model"></select></label>
            <p class="service-status"><span id="provider-status"></span><span id="model-status"></span></p>
            <div id="more-actions"></div>
          </div>
        </details>
      </nav>
    </header>
    <div class="sheet-reading">
      <button class="history-backdrop" id="history-backdrop" type="button" data-i18n-aria-label="chat.close.conversations" hidden></button>
      <aside class="history-panel" id="history-panel" data-i18n-aria-label="chat.conversations" hidden>
        <header class="history-heading"><h2 data-i18n="chat.conversations"></h2><button id="history-close" type="button" class="paper-control" data-i18n-aria-label="chat.close.conversations" data-i18n-title="chat.close.conversations"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button></header>
        <button id="history-new" type="button" class="btn ghost" data-i18n="chat.new.conversation"></button>
        <label class="history-filter"><input id="history-current-project" type="checkbox"><span data-i18n="chat.current.project.only"></span></label>
        <div id="history-status" class="history-status" role="status" aria-live="polite"></div>
        <button id="history-retry" type="button" class="link" hidden data-i18n="chat.reload"></button>
        <div id="history-items" class="history-items"></div>
        <button id="history-more" type="button" class="link" hidden data-i18n="chat.load.more"></button>
      </aside>
      <section class="sheet-conversation" data-i18n-aria-label="chat.current.conversation">
        <div id="message-scroll" class="thread" tabindex="0" data-i18n-aria-label="chat.messages">
          <div id="messages" aria-live="polite" aria-relevant="additions text"></div>
          <p id="empty-conversation" class="chat-empty" hidden data-i18n="chat.start.a.conversation"></p>
          <details id="recalled-sources" class="sources" hidden><summary data-i18n="chat.sources"></summary><div id="source-items"></div></details>
        </div>
        <button id="jump-bottom" class="link jump-bottom" type="button" hidden data-i18n="chat.new.content.jump.to.bottom"></button>
        <div id="conversation-status" class="act conversation-status" role="status" aria-live="polite" hidden></div>
        <div id="conversation-error" class="note fail" role="alert" hidden></div>
        <div id="capability-notice" class="note unsure" hidden>
          <span id="capability-notice-text"></span>
          <div class="notice-actions"><button id="capability-retry" class="link" type="button" hidden data-i18n="chat.retry"></button><button id="capability-settings" class="link" type="button" hidden data-i18n="chat.model.settings"></button></div>
        </div>
        <div class="context-bar">
          <button id="choose-workspace" type="button" class="paper-control" hidden data-i18n-aria-label="chat.choose.workspace" data-i18n-title="chat.choose.workspace"><svg class="icon" aria-hidden="true"><use href="#icon-project"></use></svg></button>
          <span id="workspace-selection" class="workspace-selection" hidden><span data-i18n="chat.workspace"></span>: <span id="workspace-label"></span><button id="clear-workspace" class="chip-remove" type="button" data-i18n-aria-label="chat.clear.workspace" data-i18n-title="chat.clear.workspace">×</button></span>
          <div id="context-chips" class="context-chips" data-i18n-aria-label="chat.context"></div>
        </div>
        <div class="composer">
          <label class="visually-hidden" for="composer" data-i18n="chat.message"></label>
          <textarea id="composer" rows="1" data-i18n-placeholder="chat.say.something" data-i18n-aria-label="chat.message" aria-describedby="composer-hint composer-error" spellcheck="true" disabled></textarea>
          <button id="send-message" type="button" class="send send-button" data-i18n-aria-label="chat.send" data-i18n-title="chat.send"><svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg></button>
          <button id="stop-generation" class="stop" type="button" hidden data-i18n-aria-label="chat.stop.generation"><svg class="icon" aria-hidden="true"><use href="#icon-stop"></use></svg><span data-i18n="chat.stop"></span></button>
          <span id="composer-hint" class="visually-hidden" data-i18n="chat.enter.to.send.shift.enter.for.a.new.line"></span>
          <span id="composer-count" class="composer-count" aria-live="polite"></span>
          <div id="composer-error" class="composer-error" role="alert" hidden></div>
        </div>
      </section>
    </div>
    <div id="page-status" class="note fail" role="status" aria-live="polite" hidden><span id="page-status-text"></span><button id="page-retry" class="link" type="button" hidden data-i18n="chat.reconnect"></button></div>
  </main>
</body>
</html>
