<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
 <title>Today</title>
 <link rel="stylesheet" href="../shared/margin.css"><link rel="stylesheet" href="peek.css">
 <script src="../shared/bridge.js" defer></script><script src="../shared/todo-i18n.js" defer></script><script src="../shared/todo.js" defer></script>
</head>
<body data-surface="peek">
 <main class="peek" aria-labelledby="heading">
  <header class="heading"><h1 id="heading" data-i18n="todo.today">Today</h1><span id="progress" class="progress" aria-live="polite">·</span></header>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <ul id="tasks" class="tasks" data-i18n-aria-label="todo.todayTasks" aria-label="Today’s remembered things"></ul>
  <form id="quick-add" class="quick-add"><label for="title" class="visually-hidden" data-i18n="todo.remember">Remember something</label>
   <div class="input-row"><input id="title" name="title" maxlength="500" autocomplete="off" data-i18n-placeholder="todo.remember" placeholder="Remember something"><button type="submit" data-i18n="todo.add">Add</button></div>
  </form>
  <button id="manage-all" class="manage-all" type="button"><span data-i18n="todo.viewAll">View all remembered things</span><span aria-hidden="true"> ›</span></button>
 </main>
</body>
</html>
